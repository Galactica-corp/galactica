syntax = "proto3";
package galactica.inflation;

import "amino/amino.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "cosmos/base/v1beta1/coin.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "google/protobuf/duration.proto";

import "galactica/inflation/params.proto";

option go_package = "github.com/Galactica-corp/galactica/x/inflation/types";

// Query defines the gRPC querier service.
service Query {
  // Parameters queries the parameters of the module.
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/Galactica-corp/galactica/inflation/params";
  }

  // CurrentPeriodDistribution queries amount of tokens to be distributed in the
  // current period.
  rpc CurrentPeriodDistribution(QueryCurrentPeriodDistributionRequest)
      returns (QueryCurrentPeriodDistributionResponse) {
    option (google.api.http).get =
        "/Galactica-corp/galactica/inflation/current-period-distribution";
  }
}

// QueryParamsRequest is request type for the Query/Params RPC method.
message QueryParamsRequest {}

// QueryParamsResponse is response type for the Query/Params RPC method.
message QueryParamsResponse {
  // params holds all the parameters of this module.
  Params params = 1
  [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}

// QueryCurrentPeriodDistributionRequest is request type for
// Query/CurrentPeriodDistribution RPC method.
message QueryCurrentPeriodDistributionRequest {}

// QueryCurrentPeriodDistributionResponse is response type for
// Query/CurrentPeriodDistribution RPC method.
message QueryCurrentPeriodDistributionResponse {
  // amount of coins provisioned to distribute in the current period.
  cosmos.base.v1beta1.DecCoin amount = 1;

  // epochs_per_period is the number of epochs in the current period.
  int64 epochs_per_period = 2;

  // epoch_duration is a duration of one epoch.
  google.protobuf.Duration epoch_duration = 3 [
    (gogoproto.nullable) = false,
    (gogoproto.stdduration) = true,
    (gogoproto.jsontag) = "epoch_duration,omitempty",
    (gogoproto.moretags) = "yaml:\"epoch_duration\""
  ];
}
